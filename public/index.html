<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oficina</title><link rel="stylesheet" href="style.css"></head><body>
<main><section id="loginView" class="card"><h1>Oficina</h1><form id="loginForm"><input id="email" type="email" placeholder="E-mail" required><input id="senha" type="password" placeholder="Senha" required><button>Entrar</button></form><p id="loginErro" class="erro"></p></section>
<section id="appView" hidden><header><h1>Gestão da Oficina</h1><button id="logout">Sair</button></header><nav><button data-tab="clientes">Clientes</button><button data-tab="veiculos">Veículos</button><button data-tab="agendamentos">Agendamentos</button></nav><div id="clientes" class="tab"><h2>Clientes</h2><input id="busca" placeholder="Buscar por nome"><form id="clienteForm" class="grid"><input name="nome" placeholder="Nome" required><input name="cpf" placeholder="CPF" required><input name="telefone" placeholder="Telefone"><input name="email" placeholder="E-mail"><button>Adicionar cliente</button></form><div id="clientesLista"></div></div><div id="veiculos" class="tab" hidden><h2>Veículos</h2><form id="veiculoForm" class="grid"><input name="cliente_id" type="number" placeholder="ID do cliente" required><input name="placa" placeholder="Placa" required><input name="modelo" placeholder="Modelo" required><input name="marca" placeholder="Marca" required><input name="ano" type="number" placeholder="Ano"><button>Adicionar veículo</button></form><div id="veiculosLista"></div></div><div id="agendamentos" class="tab" hidden><h2>Agendamentos</h2><form id="agendamentoForm" class="grid"><input name="veiculo_id" type="number" placeholder="ID do veículo" required><input name="funcionario_id" type="number" placeholder="ID do funcionário" required><input name="data_agendamento" type="date" required><input name="descricao_servico" placeholder="Serviço"><button>Agendar</button></form><div id="agendamentosLista"></div></div></section></main><script src="app.js"></script></body></html>
